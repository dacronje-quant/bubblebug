<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="/"><title>Gemini game voice verification</title>
<style>body{max-width:900px;margin:32px auto;padding:20px;font:16px system-ui;background:#f7f5ed;color:#26443d}button{padding:12px;margin:6px;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:18px;border-radius:12px}td{padding:7px}audio{width:300px}h1{font-size:30px}</style></head><body>
<h1>Gemini game voice verification</h1><p>Production voice queue and audio mixer, using every installed recording.</p>
<button id="decode">Check all recordings</button><button id="queue">Queue babies and family celebration</button><button id="advance">Finish current line</button><button id="mute">Mute and cancel</button><button id="stop">Stop</button><button id="delay">Check delayed cancellation</button>
<pre id="status" role="status">Ready.</pre><pre id="events">No playback events.</pre><pre id="decoded">Decoding not yet checked.</pre><table id="clips"></table>
<script>window.BB={}; const NativeAudio=window.Audio; let played=[],playbackEvents=[]; window.Audio=class extends NativeAudio{constructor(src){super(src);played.push(this);for(const event of ['playing','ended','pause','error'])this.addEventListener(event,()=>{playbackEvents.push(event+' '+src.split('/').pop());document.getElementById('events').textContent=playbackEvents.join('\n')})}};</script>
<script src="js/core/audio.js"></script><script src="js/core/voice-clips.js"></script><script src="js/core/voice.js"></script>
<script>
const status=document.getElementById('status'),decoded=document.getElementById('decoded'); let note='Ready.',peakPlaying=0;
setInterval(()=>{const active=played.filter(a=>!a.paused&&!a.ended).length;peakPlaying=Math.max(peakPlaying,active);status.textContent=note+'\nCurrent: '+(BB.Voice.currentId||'none')+'\nQueue: '+BB.Voice.queuedIds.join(', ')+'\nPlaying: '+active+'; maximum simultaneous: '+peakPlaying+'\nMusic gain: '+(BB.Audio.musicBus?.gain.value.toFixed(3)||'not started');},80);
function begin(){BB.Audio.init(); BB.Audio.setMuted(false); BB.Voice.stop(); played=[];playbackEvents=[];document.getElementById('events').textContent='No playback events.';peakPlaying=0;}
document.getElementById('decode').onclick=async()=>{decoded.textContent='Checking...';try{const results=await Promise.all(Object.entries(BB.VOICE_CLIPS).map(([id,c])=>new Promise((resolve,reject)=>{const a=new NativeAudio(c.file);a.onloadedmetadata=()=>resolve(id+': '+a.duration.toFixed(2)+'s · '+c.source);a.onerror=()=>reject(new Error('Could not decode '+id));a.load()})));decoded.textContent=results.length+' / '+Object.keys(BB.VOICE_CLIPS).length+' decoded successfully\n'+results.join('\n')}catch(e){decoded.textContent='FAIL: '+e.message}};
document.getElementById('queue').onclick=()=>{begin();note='Queued baby introductions, then celebration.';BB.Voice.play('cat_babySnowflake');BB.Voice.play('cat_babyPatches');BB.Voice.play('story_family_complete');BB.Audio.duck(.3,.4)};
document.getElementById('advance').onclick=()=>{const a=played.find(a=>!a.paused&&!a.ended)||played.at(-1);if(!a)return;const seek=()=>{if(Number.isFinite(a.duration))a.currentTime=Math.max(0,a.duration-.15)};if(a.readyState>=1)seek();else a.addEventListener('loadedmetadata',seek,{once:true})};
document.getElementById('mute').onclick=()=>{BB.Audio.setMuted(true);note='Muted. Queue and playback must be empty.'};
document.getElementById('stop').onclick=()=>{BB.Voice.stop();note='Stopped. Queue and playback must be empty.'};
document.getElementById('delay').onclick=()=>{begin();BB.Voice.play('story_welcome',100);BB.Voice.stop();setTimeout(()=>{note=played.length===0&&BB.Voice.currentId===null?'Delayed cancellation PASS.':'Delayed cancellation FAIL.'},200)};
for(const [id,clip]of Object.entries(BB.VOICE_CLIPS)){const tr=document.createElement('tr');const name=document.createElement('td');name.textContent=id;const td=document.createElement('td');const button=document.createElement('button');button.textContent='Play '+id;button.onclick=()=>{begin();note=clip.text;BB.Voice.play(id)};td.append(button);tr.append(name,td);document.getElementById('clips').append(tr)}
</script></body></html>
