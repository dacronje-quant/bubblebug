<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1b1433">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Bubble Paws">
  <meta name="apple-mobile-web-app-title" content="Bubble Paws">
  <title>Bubble Paws: The Rainbow Kingdom</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Bubble Paws game"></canvas>

  <!-- Big chunky touch buttons (shown automatically on touchscreens) -->
  <div id="touch" aria-hidden="true">
    <div class="tbtn" id="t-left" data-act="left"><svg viewBox="0 0 64 64"><path d="M40 14 L20 32 L40 50" /></svg></div>
    <div class="tbtn" id="t-right" data-act="right"><svg viewBox="0 0 64 64"><path d="M24 14 L44 32 L24 50" /></svg></div>
    <div class="tbtn" id="t-bubble" data-act="bubble"><svg viewBox="0 0 64 64"><circle cx="30" cy="34" r="15"/><circle cx="46" cy="18" r="7"/><path class="shine" d="M22 28 Q24 23 29 22"/></svg></div>
    <div class="tbtn" id="t-jump" data-act="jump"><svg viewBox="0 0 64 64"><path d="M16 40 L32 22 L48 40" /><path d="M20 50 L44 50" class="thin"/></svg></div>
    <div class="tbtn" id="t-trick" data-act="down"><svg viewBox="0 0 64 64"><ellipse class="pad" cx="32" cy="39" rx="11" ry="9"/><circle class="pad" cx="19" cy="27" r="5"/><circle class="pad" cx="27" cy="19" r="5"/><circle class="pad" cx="37" cy="19" r="5"/><circle class="pad" cx="45" cy="27" r="5"/></svg></div>
  </div>

  <!-- See-through map while you play (also M / Tab / gamepad Select) -->
  <button id="map-btn" aria-label="Map"><svg viewBox="0 0 32 32"><path d="M4 8 L11 5 L21 8 L28 5 L28 24 L21 27 L11 24 L4 27 Z"/><path class="fold" d="M11 5 L11 24 M21 8 L21 27"/></svg></button>

  <!-- Pause (parents: this is also where "home" and the map live) -->
  <button id="pause-btn" aria-label="Pause"><svg viewBox="0 0 32 32"><rect x="9" y="8" width="5" height="16" rx="2"/><rect x="18" y="8" width="5" height="16" rx="2"/></svg></button>

  <!-- Core -->
  <script src="js/core/bb.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/music.js"></script>
  <script src="js/core/save.js"></script>

  <!-- World data -->
  <script src="js/world/zones.js"></script>
  <script src="js/world/world.js"></script>
  <script src="js/world/rooms/gardens.js"></script>
  <script src="js/world/rooms/meadow.js"></script>
  <script src="js/world/rooms/caves.js"></script>
  <script src="js/world/rooms/hive.js"></script>
  <script src="js/world/rooms/ruins.js"></script>
  <script src="js/world/rooms/clouds.js"></script>
  <script src="js/world/rooms/lagoon.js"></script>
  <script src="js/world/rooms/dunes.js"></script>
  <script src="js/world/rooms/frost.js"></script>
  <script src="js/world/rooms/autumn.js"></script>
  <script src="js/world/rooms/springs.js"></script>
  <script src="js/world/rooms/starlight.js"></script>
  <script src="js/world/rooms/home.js"></script>

  <!-- Engine -->
  <script src="js/engine/physics.js"></script>
  <script src="js/engine/camera.js"></script>
  <script src="js/engine/particles.js"></script>

  <!-- Art -->
  <script src="js/render/gfx.js"></script>
  <script src="js/render/kittens.js"></script>
  <script src="js/render/critters.js"></script>
  <script src="js/render/tiles.js"></script>
  <script src="js/render/backdrops.js"></script>
  <script src="js/render/lighting.js"></script>
  <script src="js/render/hud.js"></script>
  <script src="js/render/mapview.js"></script>
  <script src="js/render/bossart.js"></script>
  <script src="js/render/fx.js"></script>
  <script src="js/render/home.js"></script>

  <!-- Things that live in the world -->
  <script src="js/entities/player.js"></script>
  <script src="js/entities/bubbles.js"></script>
  <script src="js/entities/bugs.js"></script>
  <script src="js/entities/things.js"></script>
  <script src="js/entities/puzzles.js"></script>
  <script src="js/entities/food.js"></script>
  <script src="js/entities/gestures.js"></script>
  <script src="js/entities/links.js"></script>
  <script src="js/entities/bosses.js"></script>

  <!-- Scenes -->
  <script src="js/scenes/title.js"></script>
  <script src="js/scenes/select.js"></script>
  <script src="js/scenes/play.js"></script>
  <script src="js/scenes/pause.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
